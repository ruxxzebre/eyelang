name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history and its tags, so that `task next -- --check` can tell when
          # ROADMAP's "What's next" was checked before the last release.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The zig that internal/zig pins builds the C the compiler emits; fetched once per pin.
      - name: Cache zig
        uses: actions/cache@v6
        with:
          path: ~/.cache/eyelang/zig
          key: zig-${{ runner.os }}-${{ hashFiles('internal/zig/zig.go') }}

      - name: Fetch zig
        run: go run ./tools/zig version

      # The Go that internal/gotool pins builds programs that the runner hosts (eye build
      # --runner, B′); fetched once per pin.
      - name: Cache the pinned Go
        uses: actions/cache@v6
        with:
          path: ~/.cache/eyelang/go
          key: go-pinned-${{ runner.os }}-${{ hashFiles('internal/gotool/gotool.go') }}

      - name: Fetch the pinned Go
        run: go run ./tools/gotool version

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0

      # @vscode/test-electron needs Node 22 or later. The npm cache keeps the packages npm ci
      # downloads for the docs and the extension.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            docs/package-lock.json
            editors/vscode/package-lock.json

      # The extension's installed packages, by its lock file: task vscode:npm finds
      # node_modules/.eyelang-lock equal to package-lock.json and skips npm ci (about 4 s).
      - name: Cache the extension's node_modules
        uses: actions/cache@v6
        with:
          path: editors/vscode/node_modules
          key: vscode-node-modules-${{ runner.os }}-node24-${{ hashFiles('editors/vscode/package-lock.json') }}

      # `task grammar` generates the parser from tree-sitter-eyelang/grammar.js and runs its corpus.
      - name: Set up tree-sitter
        run: npm install -g tree-sitter-cli@0.27.1

      # `task vscode` runs the extension in a real VS Code, downloaded once into .vscode-test.
      - name: Cache VS Code for the extension's tests
        uses: actions/cache@v6
        with:
          path: editors/vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('editors/vscode/package-lock.json') }}

      # The Postgres store's tests run against this database, each in a schema
      # of its own. EYE_TEST_DOCKER lets the test that stops and pauses a
      # database start a container of its own for that, from the same image.
      - name: Start Postgres
        run: |
          docker run -d --name eyelang-pg -e POSTGRES_USER=eye -e POSTGRES_PASSWORD=eye -e POSTGRES_DB=eye \
            -p 55432:5432 postgres:18-alpine
          for i in $(seq 1 30); do docker exec eyelang-pg pg_isready -h 127.0.0.1 -U eye && break; sleep 1; done

      - name: Check
        env:
          EYE_TEST_POSTGRES: postgres://eye:eye@localhost:55432/eye?sslmode=disable
          EYE_TEST_DOCKER: "1"
        run: task check
