name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.29.1

      # @vscode/test-electron needs Node 22 or later.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # `task grammar` generates the parser from tree-sitter-eyelang/grammar.js and runs its corpus.
      - name: Set up tree-sitter
        run: npm install -g tree-sitter-cli@0.27.0

      # `task vscode` runs the extension in a real VS Code, downloaded once into .vscode-test.
      - name: Cache VS Code for the extension's tests
        uses: actions/cache@v4
        with:
          path: editors/vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('editors/vscode/package-lock.json') }}

      - name: Check
        run: task check
