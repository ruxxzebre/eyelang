version: "3"

tasks:
  build:
    desc: Build the eye command into bin/
    cmds:
      - go build -o bin/eye ./cmd/eye

  test:
    desc: Run all Go tests
    cmds:
      - go test ./...

  coverage:
    desc: Show test coverage per package
    cmds:
      - go test -cover ./...

  coverage_profile:
    desc: Open an HTML coverage report
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out

  benchmark:
    desc: Run benchmarks
    cmds:
      - go test -bench=. -benchmem -benchtime=5s ./... {{ .CLI_ARGS }}
