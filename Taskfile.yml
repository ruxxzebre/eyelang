version: "3"

tasks:
  build:
    desc: Build the eye command into bin/
    cmds:
      - go build -o bin/eye ./cmd/eye

  test:
    desc: Run all Go tests
    cmds:
      - go test ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint (config in .golangci.yml)
    cmds:
      - golangci-lint run ./...

  check:
    desc: Everything CI runs - build, vet, lint and test
    cmds:
      - go build ./...
      - task: vet
      - task: lint
      - task: test

  coverage:
    desc: Show test coverage per package
    cmds:
      - go test -cover ./...

  coverage_profile:
    desc: Open an HTML coverage report
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out

  benchmark:
    desc: Run benchmarks
    cmds:
      - go test -bench=. -benchmem -benchtime=5s ./... {{ .CLI_ARGS }}
