version: "3"

tasks:
  build:
    desc: Build the eye command into bin/
    cmds:
      - go build -o bin/eye ./cmd/eye

  test:
    desc: Run all Go tests
    cmds:
      - go test ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint (config in .golangci.yml)
    cmds:
      - golangci-lint run ./...

  grammar:
    desc: Generate the tree-sitter parser and run its corpus tests (needs tree-sitter-cli and a C compiler)
    dir: tree-sitter-eyelang
    cmds:
      - tree-sitter generate
      - tree-sitter test

  generate:
    desc: Regenerate the parser from grammar.js and the Go node kinds and views from it
    cmds:
      - cd tree-sitter-eyelang && tree-sitter generate
      - go generate ./syntax

  generated:
    desc: Fail if the generated Go files don't match the grammar
    cmds:
      - task: generate
      - git diff --exit-code -- syntax/kind_gen.go syntax/view_gen.go

  check:
    desc: Everything CI runs - build, vet, lint, test, the grammar's tests and generated files
    cmds:
      - go build ./...
      - task: vet
      - task: lint
      - task: test
      - task: grammar
      - task: generated

  coverage:
    desc: Show test coverage per package
    cmds:
      - go test -cover ./...

  coverage_profile:
    desc: Open an HTML coverage report
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out

  benchmark:
    desc: Run benchmarks
    cmds:
      - go test -bench=. -benchmem -benchtime=5s ./... {{ .CLI_ARGS }}
