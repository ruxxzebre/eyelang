version: "3"

tasks:
  build:
    desc: Build the eye command into bin/
    cmds:
      - go build -o bin/eye ./cmd/eye

  test:
    desc: Run all Go tests
    cmds:
      - go test ./...

  quick:
    desc: The fast check while you work - build eye, test the checker, interpreter and parser, then check and test the lab's programs
    deps: [build]
    cmds:
      - go test ./check ./interp ./syntax
      - bin/eye check testdata/lab
      - bin/eye test testdata/lab

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint (config in .golangci.yml)
    cmds:
      - golangci-lint run ./...

  grammar:
    desc: Generate the tree-sitter parser and run its corpus tests (needs tree-sitter-cli and a C compiler)
    dir: tree-sitter-eyelang
    cmds:
      - tree-sitter generate
      - tree-sitter test
      # Every query must compile and run on every file of the conformance suite.
      - tree-sitter build -o ../bin/eyelang-grammar.so .
      - for q in queries/*.scm; do tree-sitter query --lib-path ../bin/eyelang-grammar.so --lang-name eyelang "$q" ../testdata/syntax/valid/*.eye > /dev/null || exit 1; done

  spec:
    desc: Render SPECS.md as one HTML page, bin/spec.html, with examples highlighted by Eyelang's own parser
    cmds:
      - go run ./tools/spechtml -o bin/spec.html

  vscode:
    desc: Test the VS Code extension and package it into bin/eyelang.vsix - vscode:unit, vscode:e2e and vscode:package (needs Node)
    cmds:
      - task: vscode:unit
      - task: vscode:e2e
      - task: vscode:package

  vscode:npm:
    desc: Install the extension's npm packages, unless package-lock.json is unchanged since the last install
    dir: editors/vscode
    run: once
    status:
      - cmp -s package-lock.json node_modules/.eyelang-lock
    cmds:
      # npm ci can't remove a directory that holds a file it didn't install, such as a .DS_Store
      # Finder left in node_modules, so clear it first.
      - rm -rf node_modules
      - npm ci --no-fund --no-audit
      - cp package-lock.json node_modules/.eyelang-lock

  vscode:unit:
    desc: Check the extension's grammar scopes, and that eye lsp answers the extension's client
    dir: editors/vscode
    deps: [build, vscode:npm]
    cmds:
      - npm test

  vscode:e2e:
    desc: Run the extension in a real VS Code against eye lsp (set VSCODE_EXECUTABLE to use an installed one)
    dir: editors/vscode
    deps: [build, vscode:npm]
    cmds:
      - if [ "$(uname)" = Linux ] && command -v xvfb-run > /dev/null; then xvfb-run -a npm run test:vscode; else npm run test:vscode; fi

  vscode:package:
    desc: Package the extension into bin/eyelang.vsix
    dir: editors/vscode
    deps: [vscode:npm]
    cmds:
      - npm run package

  generate:
    desc: Regenerate everything derived from grammar.js and SPECS.md
    cmds:
      - cd tree-sitter-eyelang && tree-sitter generate
      - go generate ./syntax
      - go run ./tools/specexamples

  generated:
    desc: Fail if generated files in git don't match grammar.js and SPECS.md
    cmds:
      - task: generate
      - git diff --exit-code -- syntax/kind_gen.go syntax/view_gen.go testdata/syntax/valid testdata/programs/tour/tour.eye
      - test -z "$(git ls-files --others --exclude-standard -- testdata/syntax/valid)"

  conformance:
    desc: Compare the hand-written parser with tree-sitter on every file in testdata/syntax and the corpus
    env:
      EYE_CONFORMANCE: "1"
    cmds:
      - go test ./syntax -run 'TestConformance' -count=1

  fmt:
    desc: Format the repository's Eyelang sources
    cmds:
      - go run ./cmd/eye fmt testdata/fmt/*.golden.eye

  fmt-check:
    desc: Fail if any of the repository's Eyelang sources isn't formatted
    cmds:
      - go run ./cmd/eye fmt --check testdata/fmt/*.golden.eye
      # The programs, except the tour, which is the spec's text.
      - go run ./cmd/eye fmt --check $(find testdata/programs testdata/lab check/std check/runtime check/prelude.eye -name '*.eye' ! -name tour.eye)

  check:
    desc: Everything CI runs - generated files, build, vet, lint, tests, formatting, the conformance suite, the grammar's tests and the VS Code extension
    cmds:
      - task: generated
      - go build ./...
      - task: vet
      - task: lint
      - task: test
      - task: fmt-check
      - task: conformance
      - task: grammar
      - task: vscode

  coverage:
    desc: Show test coverage per package
    cmds:
      - go test -cover ./...

  coverage_profile:
    desc: Open an HTML coverage report
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out

  benchmark:
    desc: Run benchmarks
    cmds:
      - go test -bench=. -benchmem -benchtime=5s ./... {{ .CLI_ARGS }}
