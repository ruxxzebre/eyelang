version: "3"

tasks:
  build:
    desc: Build the eye command into bin/
    cmds:
      - go build -o bin/eye ./cmd/eye

  test:
    desc: Run all Go tests
    cmds:
      - go test ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint (config in .golangci.yml)
    cmds:
      - golangci-lint run ./...

  grammar:
    desc: Generate the tree-sitter parser and run its corpus tests (needs tree-sitter-cli and a C compiler)
    dir: tree-sitter-eyelang
    cmds:
      - tree-sitter generate
      - tree-sitter test

  generate:
    desc: Regenerate everything derived from grammar.js and SPECS.md
    cmds:
      - cd tree-sitter-eyelang && tree-sitter generate
      - go generate ./syntax
      - go run ./tools/specexamples

  generated:
    desc: Fail if generated files in git don't match grammar.js and SPECS.md
    cmds:
      - task: generate
      - git diff --exit-code -- syntax/kind_gen.go syntax/view_gen.go testdata/syntax/valid
      - test -z "$(git ls-files --others --exclude-standard -- testdata/syntax/valid)"

  conformance:
    desc: Compare the hand-written parser with tree-sitter on every file in testdata/syntax and the corpus
    env:
      EYE_CONFORMANCE: "1"
    cmds:
      - go test ./syntax -run 'TestConformance' -count=1

  fmt:
    desc: Format the repository's Eyelang sources
    cmds:
      - go run ./cmd/eye fmt testdata/fmt/*.golden.eye

  fmt-check:
    desc: Fail if any of the repository's Eyelang sources isn't formatted
    cmds:
      - go run ./cmd/eye fmt --check testdata/fmt/*.golden.eye

  check:
    desc: Everything CI runs - generated files, build, vet, lint, tests, formatting, the conformance suite and the grammar's tests
    cmds:
      - task: generated
      - go build ./...
      - task: vet
      - task: lint
      - task: test
      - task: fmt-check
      - task: conformance
      - task: grammar

  coverage:
    desc: Show test coverage per package
    cmds:
      - go test -cover ./...

  coverage_profile:
    desc: Open an HTML coverage report
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out

  benchmark:
    desc: Run benchmarks
    cmds:
      - go test -bench=. -benchmem -benchtime=5s ./... {{ .CLI_ARGS }}
